# ~/.config/alacritty/alacritty.toml

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "none"
opacity = 1.0
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[font.offset]
x = 0
y = 1

# ---------- cores (mesma paleta da waybar) ----------
[colors.primary]
background = "#16181a"
foreground = "#b8b8ae"
dim_foreground = "#6b6f76"

[colors.cursor]
text = "#16181a"
cursor = "#b8b8ae"

[colors.selection]
text = "CellForeground"
background = "#2e3238"

[colors.normal]
black   = "#2e3238"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#5e81ac"
magenta = "#b48ead"
cyan    = "#88c0d0"
white   = "#b8b8ae"

[colors.bright]
black   = "#4a4e54"
red     = "#d08770"
green   = "#b5cfa0"
yellow  = "#f0d8a0"
blue    = "#81a1c1"
magenta = "#c5a3bf"
cyan    = "#9fd4e0"
white   = "#e8e6df"

# ---------- atalhos ----------
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
